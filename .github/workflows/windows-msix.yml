# Gera o pacote MSIX (para a Microsoft Store) do Dry Eye Widget.
#
# A Store assina o MSIX automaticamente (política 10.2.9) — não usa certificado.
# O .msix sai como artefato do run; baixe e envie no Partner Center.
#
# Pré-requisito: os valores de identidade em `msix_config` (pubspec.yaml) devem
# ser os do Partner Center → Gerenciamento de produtos → Identidade do produto.

name: Windows MSIX (Store)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-msix:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.44.1"
          cache: true

      - name: Habilitar desktop Windows
        run: flutter config --enable-windows-desktop

      - name: Dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Testes
        run: flutter test

      - name: Build Release
        run: flutter build windows --release
        env:
          # Mesma mitigação do build .exe (STL1011 no MSVC 14.51).
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS

      - name: Gerar MSIX para a Store
        run: dart run msix:create --store

      - name: Localizar o .msix
        id: find
        shell: pwsh
        run: |
          $msix = Get-ChildItem -Recurse -Filter *.msix |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msix) { throw "Nenhum .msix gerado." }
          Write-Host "MSIX: $($msix.FullName)"
          "path=$($msix.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Normalizar pacote e gerar manifesto verificável
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $target = "dist\dry_eye_widget.msix"
          Copy-Item "${{ steps.find.outputs.path }}" $target -Force
          $versionMatch = Select-String -Path "pubspec.yaml" `
            -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\+\d+'
          if (-not $versionMatch) { throw "Versão do pubspec não encontrada." }
          @{
            schemaVersion = 1
            platform = "windows-msix"
            tag = $env:GITHUB_REF_NAME
            sourceSha = $env:GITHUB_SHA
            version = $versionMatch.Matches[0].Groups[1].Value
            files = @(@{
              name = "dry_eye_widget.msix"
              size = (Get-Item $target).Length
              sha256 = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
            })
          } | ConvertTo-Json -Depth 4 |
            Out-File "dist\release-manifest-msix.json" -Encoding utf8

      - name: Subir artefato (.msix)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dry-eye-widget-msix
          path: |
            dist/dry_eye_widget.msix
            dist/release-manifest-msix.json
          if-no-files-found: error
