# Quando a versão do app sobe no pubspec, exige menção no CHANGELOG.

name: Changelog guard

on:
  pull_request:
    paths:
      - "pubspec.yaml"
      - "CHANGELOG.md"
      - "lib/utils/constants.dart"

permissions:
  contents: read

jobs:
  guard:
    name: Versão ↔ CHANGELOG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Se pubspec mudou de versão, CHANGELOG deve citar x.y.z
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          if ! git diff --name-only "$BASE" "$HEAD" | grep -qE '^pubspec\.yaml$'; then
            echo "pubspec.yaml não mudou — ok"
            exit 0
          fi

          NEW=$(grep -E '^version:' pubspec.yaml | head -1 | sed -E 's/version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          OLD=$(git show "$BASE:pubspec.yaml" | grep -E '^version:' | head -1 | sed -E 's/version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/' || true)

          echo "versão base=$OLD head=$NEW"
          if [ -z "$NEW" ]; then
            echo "Não foi possível ler versão em pubspec.yaml"
            exit 1
          fi
          if [ "$OLD" = "$NEW" ]; then
            echo "Versão x.y.z inalterada — ok"
            exit 0
          fi

          if ! grep -qE "(^## |^### |\[)${NEW}" CHANGELOG.md && ! grep -qF "$NEW" CHANGELOG.md; then
            echo "Bump $OLD → $NEW sem menção a $NEW em CHANGELOG.md"
            exit 1
          fi
          echo "CHANGELOG menciona $NEW — ok"
