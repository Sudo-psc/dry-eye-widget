# Build e publicação da versão Windows do Dry Eye Widget.
#
# - PR/push manual: compila e sobe os artefatos do build.
# - Tag vX.Y.Z: compila e sobe instalador + ZIP como artefatos internos.
# - A publicação final é centralizada após os três builds de plataforma.

name: Windows Build

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "lib/**"
      - "test/**"
      - "windows/**"
      - "analysis_options.yaml"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "scripts/check_release_readiness.sh"
      - "scripts/validate_release_source.sh"
      - "scripts/validate_release_bundle.sh"
      - ".github/workflows/windows-build.yml"
      - "win_version/templates/windows-build.yml"
      - "win_version/templates/dry-eye-widget.iss"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          # Fixado na versão estável usada/validada localmente (flutter --version).
          flutter-version: "3.44.1"
          cache: true

      - name: Habilitar desktop Windows
        run: flutter config --enable-windows-desktop

      - name: Dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Testes
        run: flutter test

      - name: Testes nativos de armazenamento Windows
        shell: pwsh
        run: |
          cmake -S windows/runner/tests -B build/windows-secure-store-tests -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/windows-secure-store-tests --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/windows-secure-store-tests -C Release --output-on-failure

      - name: Gerar ícones
        run: dart run flutter_launcher_icons

      - name: Build Release
        run: flutter build windows --release
        env:
          # VS 2026/MSVC 14.51 (novo windows-latest) trata <experimental/coroutine>
          # como erro (STL1011). audioplayers_windows ainda usa o header antigo;
          # silencia a depreciação em todos os alvos via variável CL do cl.exe.
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS

      - name: Validar runtime antes de empacotar
        shell: pwsh
        run: |
          $release = "build\windows\x64\runner\Release"
          foreach ($name in @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")) {
            $path = Join-Path $release $name
            if (-not (Test-Path $path -PathType Leaf) -or (Get-Item $path).Length -eq 0) {
              throw "Visual C++ runtime ausente ou vazio: $name"
            }
          }

      - name: Verificar abertura do aplicativo Windows
        shell: pwsh
        run: |
          $release = (Resolve-Path "build\windows\x64\runner\Release").Path
          $app = Start-Process (Join-Path $release "dry_eye_widget.exe") `
            -WorkingDirectory $release -PassThru
          try {
            $opened = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Seconds 1
              $app.Refresh()
              if ($app.HasExited) { throw "O aplicativo encerrou ao abrir: $($app.ExitCode)" }
              if ($app.MainWindowHandle -ne [IntPtr]::Zero) { $opened = $true; break }
            }
            if (-not $opened) { throw "A janela principal não abriu em 30 segundos." }
            Write-Host "Processo e janela principal verificados."
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }

      - name: Gerar ZIP portátil
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath "dist\DryEyeWidget-windows-x64.zip" -Force

      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Gerar instalador
        shell: pwsh
        run: |
          $iss = "win_version\templates\dry-eye-widget.iss"
          if (Test-Path $iss) {
            $versionMatch = Select-String -Path "pubspec.yaml" -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\+\d+'
            if (-not $versionMatch) {
              throw "Não foi possível extrair a versão do pubspec.yaml"
            }
            $version = $versionMatch.Matches[0].Groups[1].Value
            $appInfo = Get-Content "lib\utils\constants.dart" -Raw
            $expected = "static const String version = '$version';"
            if (-not $appInfo.Contains($expected)) {
              throw "AppInfo.version não está em sincronia com pubspec.yaml: esperado $version"
            }
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" $iss
          } else {
            Write-Warning "Script .iss não encontrado em $iss — pulando instalador."
          }

      - name: Status da assinatura Windows
        shell: pwsh
        run: |
          $installer = "dist\DryEyeWidget-Setup-x64.exe"
          $status = "unsigned"
          if (Test-Path $installer) {
            $sig = Get-AuthenticodeSignature $installer
            Write-Host "Authenticode: $($sig.Status) — $($sig.SignerCertificate.Subject)"
            if ($sig.Status -eq "Valid") { $status = "signed" }
          }
          @"
          ## Windows release artifacts
          | Campo | Valor |
          |-------|-------|
          | Secrets neste workflow | ``nenhum`` |
          | Instalador Authenticode | ``$status`` |
          | Artefatos | Setup + ZIP portátil |
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Gerar manifesto verificável
        shell: pwsh
        run: |
          $versionMatch = Select-String -Path "pubspec.yaml" `
            -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\+\d+'
          if (-not $versionMatch) { throw "Versão do pubspec não encontrada." }
          $files = @(
            "DryEyeWidget-windows-x64.zip",
            "DryEyeWidget-Setup-x64.exe"
          ) | ForEach-Object {
            $path = Join-Path "dist" $_
            if (-not (Test-Path $path)) { throw "Artefato ausente: $path" }
            @{
              name = $_
              size = (Get-Item $path).Length
              sha256 = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          @{
            schemaVersion = 1
            platform = "windows"
            tag = $env:GITHUB_REF_NAME
            sourceSha = $env:GITHUB_SHA
            version = $versionMatch.Matches[0].Groups[1].Value
            files = $files
          } | ConvertTo-Json -Depth 4 |
            Out-File "dist\release-manifest-windows.json" -Encoding utf8

      - name: Upload de artefatos (toda execução)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dry-eye-widget-windows
          path: |
            dist/DryEyeWidget-windows-x64.zip
            dist/DryEyeWidget-Setup-x64.exe
            dist/release-manifest-windows.json
          if-no-files-found: error
