# Build e publicação da versão Windows do Dry Eye Widget.
#
# - PR/push manual: compila e sobe os artefatos do build.
# - Tag vX.Y.Z: compila e anexa instalador + ZIP à GitHub Release.

name: Windows Build

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "lib/**"
      - "test/**"
      - "windows/**"
      - "analysis_options.yaml"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/windows-build.yml"
      - "win_version/templates/windows-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    # `secrets` não pode ser usado diretamente em `if:` — expõe como env de job.
    # Assinatura via SignPath (OSS): só roda quando o token está configurado.
    env:
      SIGN_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Fixado na versão estável usada/validada localmente (flutter --version).
          flutter-version: "3.44.1"
          cache: true

      - name: Habilitar desktop Windows
        run: flutter config --enable-windows-desktop

      - name: Dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Testes
        run: flutter test

      - name: Gerar ícones
        run: dart run flutter_launcher_icons

      - name: Build Release
        run: flutter build windows --release
        env:
          # VS 2026/MSVC 14.51 (novo windows-latest) trata <experimental/coroutine>
          # como erro (STL1011). audioplayers_windows ainda usa o header antigo;
          # silencia a depreciação em todos os alvos via variável CL do cl.exe.
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS

      - name: Gerar ZIP portátil
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath "dist\DryEyeWidget-windows-x64.zip" -Force

      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Gerar instalador
        shell: pwsh
        run: |
          $iss = "win_version\templates\dry-eye-widget.iss"
          if (Test-Path $iss) {
            $versionMatch = Select-String -Path "pubspec.yaml" -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\+\d+'
            if (-not $versionMatch) {
              throw "Não foi possível extrair a versão do pubspec.yaml"
            }
            $version = $versionMatch.Matches[0].Groups[1].Value
            $appInfo = Get-Content "lib\utils\constants.dart" -Raw
            $expected = "static const String version = '$version';"
            if (-not $appInfo.Contains($expected)) {
              throw "AppInfo.version não está em sincronia com pubspec.yaml: esperado $version"
            }
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" $iss
          } else {
            Write-Warning "Script .iss não encontrado em $iss — pulando instalador."
          }

      # --- Assinatura via SignPath (OSS) — OPCIONAL ----------------------------
      # Assina o instalador nos servidores do SignPath (HSM). Só roda quando o
      # token e os IDs estão configurados (veja win_version/CODE_SIGNING.md):
      #   Secret: SIGNPATH_API_TOKEN
      #   Vars:   SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_POLICY_SLUG
      # Sem isso, os passos são pulados e o instalador segue não assinado.
      - name: Subir instalador (artefato p/ o SignPath)
        if: ${{ env.SIGN_SIGNPATH == 'true' }}
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: dist/DryEyeWidget-Setup-x64.exe
          if-no-files-found: error

      - name: Assinar instalador (SignPath)
        if: ${{ env.SIGN_SIGNPATH == 'true' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Aplicar instalador assinado
        if: ${{ env.SIGN_SIGNPATH == 'true' }}
        shell: pwsh
        run: |
          $signed = Get-ChildItem -Path signed -Filter *.exe -Recurse |
            Select-Object -First 1
          if ($signed) {
            Copy-Item $signed.FullName "dist\DryEyeWidget-Setup-x64.exe" -Force
            Write-Host "Instalador assinado aplicado: $($signed.FullName)"
          } else {
            Write-Warning "Instalador assinado não encontrado — mantendo o não assinado."
          }

      - name: Upload de artefatos (toda execução)
        uses: actions/upload-artifact@v4
        with:
          name: dry-eye-widget-windows
          path: |
            dist/DryEyeWidget-windows-x64.zip
            dist/DryEyeWidget-Setup-x64.exe
          if-no-files-found: warn

      - name: Anexar à Release (apenas em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/DryEyeWidget-windows-x64.zip
            dist/DryEyeWidget-Setup-x64.exe
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
