# Build e publicação da versão macOS do Dry Eye Widget.
#
# - PR/push manual: compila e sobe o .dmg como artefato.
# - Tag vX.Y.Z: compila e sobe o .dmg como artefato interno.
# - A publicação final é centralizada após os três builds de plataforma.
# - Este workflow disparado por tag não recebe secrets. O DMG sai unsigned
#   (fluxo xattr); assinatura/notarização exige fluxo privilegiado separado,
#   executado somente a partir da default branch protegida.

name: macOS Build

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "lib/**"
      - "test/**"
      - "macos/**"
      - "scripts/make_dmg.sh"
      - "scripts/check_release_readiness.sh"
      - "scripts/validate_release_source.sh"
      - "scripts/validate_release_bundle.sh"
      - "analysis_options.yaml"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/macos-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.44.1"
          cache: true

      - name: Habilitar desktop macOS
        run: flutter config --enable-macos-desktop

      - name: Dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Testes
        run: flutter test

      - name: Gerar ícones
        run: dart run flutter_launcher_icons

      - name: Build Release
        run: flutter build macos --release

      - name: Gerar .dmg (unsigned base)
        run: |
          chmod +x scripts/make_dmg.sh
          ./scripts/make_dmg.sh "${GITHUB_REF_NAME#v}"

      - name: Status da assinatura
        run: |
          {
            echo "## macOS release artifact"
            echo "| Campo | Valor |"
            echo "|-------|-------|"
            echo "| Assinatura | \`unsigned\` |"
            echo "| Artefato | \`dist/DryEyeWidget.dmg\` |"
            echo "| Secrets neste workflow | \`nenhum\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "DMG sem Developer ID — usuários precisam do fluxo xattr (documentado no volume e na landing)." >> "$GITHUB_STEP_SUMMARY"

      - name: Gerar manifesto verificável
        run: |
          VERSION="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml | head -1)"
          jq -n \
            --arg platform "macos" \
            --arg tag "$GITHUB_REF_NAME" \
            --arg sourceSha "$GITHUB_SHA" \
            --arg version "$VERSION" \
            --arg name "DryEyeWidget.dmg" \
            --arg sha256 "$(shasum -a 256 dist/DryEyeWidget.dmg | awk '{print $1}')" \
            --argjson size "$(stat -f%z dist/DryEyeWidget.dmg)" \
            '{
              schemaVersion: 1,
              platform: $platform,
              tag: $tag,
              sourceSha: $sourceSha,
              version: $version,
              files: [{name: $name, size: $size, sha256: $sha256}]
            }' > dist/release-manifest-macos.json

      - name: Upload de artefatos (toda execução)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dry-eye-widget-macos
          path: |
            dist/DryEyeWidget.dmg
            dist/release-manifest-macos.json
          if-no-files-found: error
