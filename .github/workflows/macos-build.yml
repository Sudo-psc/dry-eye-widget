# Build e publicação da versão macOS do Dry Eye Widget.
#
# - PR/push manual: compila e sobe o .dmg como artefato.
# - Tag vX.Y.Z: compila e anexa o DryEyeWidget.dmg à GitHub Release.
# - Assinatura Developer ID + notarização: opcional, só com secrets
#   (veja docs/CODE_SIGNING.md). Sem secrets o DMG sai unsigned (fluxo xattr).

name: macOS Build

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "lib/**"
      - "test/**"
      - "macos/**"
      - "scripts/make_dmg.sh"
      - "scripts/macos_import_cert.sh"
      - "scripts/macos_sign_and_notarize.sh"
      - "analysis_options.yaml"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/macos-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    env:
      # secrets não podem ir direto em if: — expõe como env de job
      HAS_MAC_CERT: ${{ secrets.MACOS_CERTIFICATE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.1"
          cache: true

      - name: Habilitar desktop macOS
        run: flutter config --enable-macos-desktop

      - name: Dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Testes
        run: flutter test

      - name: Gerar ícones
        run: dart run flutter_launcher_icons

      - name: Importar certificado Developer ID
        if: ${{ env.HAS_MAC_CERT == 'true' }}
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_IDENTITY: ${{ vars.MACOS_IDENTITY }}
        run: |
          chmod +x scripts/macos_import_cert.sh
          ./scripts/macos_import_cert.sh

      - name: Build Release
        run: flutter build macos --release

      - name: Gerar .dmg (unsigned base)
        run: |
          chmod +x scripts/make_dmg.sh
          ./scripts/make_dmg.sh "${GITHUB_REF_NAME#v}"

      - name: Assinar e notarizar
        id: sign
        env:
          # MACOS_IDENTITY / KEYCHAIN_* vêm do step de import (GITHUB_ENV) quando há cert.
          MACOS_SIGNING_ENABLED: ${{ env.HAS_MAC_CERT }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          chmod +x scripts/macos_sign_and_notarize.sh
          # HAS_MAC_CERT é "true"/"false" (string). Script só assina com "true".
          if [ "${MACOS_SIGNING_ENABLED}" != "true" ]; then
            export MACOS_SIGNING_ENABLED=false
          fi
          if [ -n "${APPLE_API_KEY_BASE64:-}" ]; then
            KEY_PATH="${RUNNER_TEMP}/AuthKey.p8"
            echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
            export APPLE_API_KEY_PATH="$KEY_PATH"
          fi
          ./scripts/macos_sign_and_notarize.sh "${GITHUB_REF_NAME#v}"

      - name: Status da assinatura
        run: |
          STATUS="${{ steps.sign.outputs.status }}"
          STATUS="${STATUS:-unsigned}"
          {
            echo "## macOS release artifact"
            echo "| Campo | Valor |"
            echo "|-------|-------|"
            echo "| Assinatura | \`$STATUS\` |"
            echo "| Artefato | \`dist/DryEyeWidget.dmg\` |"
            echo "| Certificado no repo | \`${{ env.HAS_MAC_CERT }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$STATUS" = "unsigned" ]; then
            echo "DMG sem Developer ID — usuários precisam do fluxo xattr (documentado no volume e na landing)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload de artefatos (toda execução)
        uses: actions/upload-artifact@v4
        with:
          name: dry-eye-widget-macos
          path: dist/DryEyeWidget.dmg
          if-no-files-found: warn

      - name: Anexar à Release (apenas em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DryEyeWidget.dmg
          fail_on_unmatched_files: false
          body: |
            ### macOS
            - Artefato: `DryEyeWidget.dmg`
            - Assinatura: veja o summary do job **macOS Build** (signed / signed+notarized / unsigned)
            - Sem notarização: se o macOS disser que o arquivo está danificado, rode:
              `xattr -cr ~/Downloads/DryEyeWidget*.dmg`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
