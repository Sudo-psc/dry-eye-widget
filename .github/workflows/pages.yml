# Publica a landing estática (pasta site/) no GitHub Pages.
# Servido em https://sudo-psc.github.io/dry-eye-widget/

name: Deploy Pages (site)

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "web/science/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; não cancela um deploy em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/science/package-lock.json

      - name: Gerar página Science
        run: npm ci --prefix web/science && npm run build --prefix web/science

      - name: Configurar Pages
        uses: actions/configure-pages@v6

      - name: Smoke test da landing
        run: node site/scripts/smoke-check.mjs

      - name: Subir artefato (pasta site/)
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
