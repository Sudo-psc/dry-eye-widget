# Checks de PR e push em main: Flutter + smoke da landing.
# Não publica artefatos — só qualidade.
# Jobs em paralelo; summary no final para leitura rápida no GitHub.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.1"
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Testes
        run: flutter test --reporter expanded

  site:
    name: Landing build & smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/science/package-lock.json

      - name: Gerar página Science
        run: npm ci --prefix web/science && npm run build --prefix web/science

      - name: Smoke test da landing
        run: node site/scripts/smoke-check.mjs

  version-sync:
    name: Versão app ↔ landing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Conferir metadados de versão
        run: |
          bash scripts/check_release_readiness.sh --metadata
          PUB=$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml | head -1)
          {
            echo "## Version sync"
            echo "Metadados locais sincronizados em \`$PUB\`."
            echo
            echo "Tag e artefatos públicos permanecem gates separados."
          } >> "$GITHUB_STEP_SUMMARY"

  release-pipeline:
    name: Release manifests & idempotency guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validar scripts, manifests e exclusão de arquivos extras
        run: bash scripts/test_release_pipeline.sh

  ci-summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs: [flutter, site, version-sync, release-pipeline]
    if: always()
    steps:
      - name: Agregar resultado
        run: |
          set -euo pipefail
          F="${{ needs.flutter.result }}"
          S="${{ needs.site.result }}"
          V="${{ needs.version-sync.result }}"
          R="${{ needs.release-pipeline.result }}"
          {
            echo "## CI jobs"
            echo "| Job | Resultado |"
            echo "|-----|----------|"
            echo "| Flutter | \`$F\` |"
            echo "| Landing smoke | \`$S\` |"
            echo "| Version sync | \`$V\` |"
            echo "| Release pipeline | \`$R\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$F" != "success" ] || [ "$S" != "success" ] || [ "$V" != "success" ] || [ "$R" != "success" ]; then
            echo "Um ou mais jobs falharam."
            exit 1
          fi
          echo "Todos os jobs de qualidade passaram."
