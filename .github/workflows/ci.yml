# Checks de PR e push em main: Flutter + smoke da landing.
# Não publica artefatos — só qualidade.
# Jobs em paralelo; summary no final para leitura rápida no GitHub.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.1"
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Testes
        run: flutter test --reporter expanded

  site:
    name: Landing build & smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/science/package-lock.json

      - name: Gerar página Science
        run: npm ci --prefix web/science && npm run build --prefix web/science

      - name: Smoke test da landing
        run: node site/scripts/smoke-check.mjs

  version-sync:
    name: Versão app ↔ landing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir softwareVersion e badge
        run: |
          set -euo pipefail
          PUB=$(grep -E '^version:' pubspec.yaml | head -1 | sed -E 's/version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          SCHEMA=$(grep -oE '"softwareVersion":[[:space:]]*"[0-9]+\.[0-9]+\.[0-9]+"' site/index.html | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          BADGE=$(grep -oE 'id="app-version">[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+' site/index.html | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          CONST=$(grep -E "static const String version = '" lib/utils/constants.dart | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "pubspec=$PUB schema=$SCHEMA badge=$BADGE constants=$CONST"
          test "$PUB" = "$SCHEMA"
          test "$PUB" = "$BADGE"
          test "$PUB" = "$CONST"
          {
            echo "## Version sync"
            echo "| Fonte | Valor |"
            echo "|-------|-------|"
            echo "| pubspec | \`$PUB\` |"
            echo "| JSON-LD | \`$SCHEMA\` |"
            echo "| badge | \`$BADGE\` |"
            echo "| constants | \`$CONST\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  ci-summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs: [flutter, site, version-sync]
    if: always()
    steps:
      - name: Agregar resultado
        run: |
          set -euo pipefail
          F="${{ needs.flutter.result }}"
          S="${{ needs.site.result }}"
          V="${{ needs.version-sync.result }}"
          {
            echo "## CI jobs"
            echo "| Job | Resultado |"
            echo "|-----|----------|"
            echo "| Flutter | \`$F\` |"
            echo "| Landing smoke | \`$S\` |"
            echo "| Version sync | \`$V\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$F" != "success" ] || [ "$S" != "success" ] || [ "$V" != "success" ]; then
            echo "Um ou mais jobs falharam."
            exit 1
          fi
          echo "Todos os jobs de qualidade passaram."
