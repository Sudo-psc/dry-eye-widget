<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  :root{ --idle:#4A90E2; --alert:#FF4444; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:880px; height:520px; overflow:hidden;
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  /* "Desktop" de fundo, para dar contexto de tela */
  #stage{ position:relative; width:880px; height:520px;
    background:
      radial-gradient(1200px 700px at 78% -10%, #1b2a4a 0%, #0e1730 45%, #070d1d 100%);
    overflow:hidden; }
  .menubar{ position:absolute; top:0; left:0; right:0; height:26px;
    background:rgba(255,255,255,.06); backdrop-filter:blur(6px);
    border-bottom:1px solid rgba(255,255,255,.08);
    display:flex; align-items:center; gap:14px; padding:0 14px;
    color:#cbd5e1; font-size:12px; }
  .menubar .dot{ width:9px;height:9px;border-radius:50%; }
  .grow{ flex:1; }
  .faux-doc{ position:absolute; left:60px; top:70px; width:430px; height:380px;
    background:linear-gradient(180deg,#0f1830,#0c1428); border-radius:14px;
    border:1px solid rgba(255,255,255,.06); box-shadow:0 30px 60px rgba(0,0,0,.45);
    padding:26px 28px; }
  .faux-doc .line{ height:11px; border-radius:6px; margin:0 0 14px 0;
    background:rgba(255,255,255,.10); }

  /* Bolinha flutuante */
  #ballwrap{ position:absolute; }
  .ring{ position:absolute; inset:0; }
  .ball{ position:absolute; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #cfe2fb 0%, var(--idle) 52%, #2c5d97 100%);
    box-shadow:0 12px 26px rgba(0,0,0,.45); }
  .ball .spec{ position:absolute; left:18%; top:14%; width:34%; height:34%;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.8), rgba(255,255,255,0) 70%); }

  /* Overlay de pausa */
  #overlay{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(4,8,20,.0); }
  .card{ width:560px; text-align:center; color:#fff;
    background:rgba(20,30,55,.55); border:1px solid rgba(255,255,255,.14);
    border-radius:26px; padding:34px 36px 40px;
    box-shadow:0 40px 90px rgba(0,0,0,.5); backdrop-filter:blur(16px); }
  .eyewrap{ width:120px;height:120px;margin:2px auto 14px; position:relative; }
  .title{ font-size:26px; font-weight:700; letter-spacing:.2px; }
  .sub{ font-size:15px; color:#cdd8ee; margin-top:8px; }
  .count{ position:relative; width:150px; height:150px; margin:18px auto 4px; }
  .count .num{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:46px; font-weight:800; }
  .badge{ display:inline-block; margin-top:6px; font-size:13px; color:#9fb3d8;
    background:rgba(255,255,255,.06); padding:5px 12px; border-radius:999px; }
  .tip{ position:absolute; left:50%; transform:translateX(-50%); bottom:18px;
    color:#8ea3c8; font-size:12.5px; letter-spacing:.3px; }
</style>
</head>
<body>
<div id="stage">
  <div class="menubar">
    <span class="dot" style="background:#ff5f57"></span>
    <span class="dot" style="background:#febc2e"></span>
    <span class="dot" style="background:#28c840"></span>
    <span class="grow"></span>
    <span id="mb-eye">👁️ Dry Eye Widget</span>
    <span>14:32</span>
  </div>

  <div class="faux-doc">
    <div class="line" style="width:70%"></div>
    <div class="line" style="width:92%"></div>
    <div class="line" style="width:84%"></div>
    <div class="line" style="width:96%"></div>
    <div class="line" style="width:60%"></div>
    <div class="line" style="width:88%"></div>
    <div class="line" style="width:50%"></div>
  </div>

  <!-- Bolinha + anel de progresso -->
  <div id="ballwrap">
    <svg class="ring" id="ring" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="4"/>
      <circle id="ringfill" cx="50" cy="50" r="44" fill="none" stroke="#fff" stroke-width="4"
        stroke-linecap="round" transform="rotate(-90 50 50)"/>
    </svg>
    <div class="ball" id="ball"><div class="spec"></div></div>
  </div>

  <!-- Overlay de pausa -->
  <div id="overlay" style="opacity:0">
    <div class="card" id="card">
      <div class="eyewrap">
        <svg id="eye" viewBox="0 0 120 120" width="120" height="120"></svg>
      </div>
      <div class="title" id="ovtitle">Olhe para uma distância de 6 metros</div>
      <div class="sub" id="ovsub">Pisque devagar e relaxe os olhos</div>
      <div class="count" id="countwrap">
        <svg viewBox="0 0 100 100" style="position:absolute;inset:0">
          <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="6"/>
          <circle id="cfill" cx="50" cy="50" r="44" fill="none" stroke="#7fd1ff" stroke-width="6"
            stroke-linecap="round" transform="rotate(-90 50 50)"/>
        </svg>
        <div class="num" id="cnum">20</div>
      </div>
      <div class="badge">Regra 20·20·20 — a cada 20 min, 20 s, 6 m</div>
    </div>
  </div>

  <div class="tip" id="tip">Dry Eye Widget — micro-pausas para a fadiga visual digital</div>
</div>

<script>
const RING = 2*Math.PI*44;
const $ = s => document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*clamp(t,0,1);
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
$("#ringfill").style.strokeDasharray = RING;
$("#cfill").style.strokeDasharray = RING;

// Posição/tamanho da bolinha
const BX=752, BY=78, BS=72;             // canto superior direito
function placeBall(scale){
  const s=BS*scale, off=(BS-s)/2;
  const wrap=$("#ballwrap");
  wrap.style.left=BX+"px"; wrap.style.top=BY+"px";
  wrap.style.width=BS+"px"; wrap.style.height=BS+"px";
  const b=$("#ball");
  b.style.width=s+"px"; b.style.height=s+"px"; b.style.left=off+"px"; b.style.top=off+"px";
}

function eyeSVG(open){ // open: 1 aberto, 0 fechado
  const cy=60, w=46;
  const lid = lerp(2, 30, 1-open); // altura da pálpebra
  return `
   <defs><clipPath id="ec"><ellipse cx="60" cy="${cy}" rx="${w}" ry="${24*open+2}"/></clipPath></defs>
   <ellipse cx="60" cy="${cy}" rx="${w}" ry="${24*open+2}" fill="#0b1226" stroke="#bcd4ff" stroke-width="3"/>
   <g clip-path="url(#ec)">
     <circle cx="60" cy="${cy}" r="16" fill="#5aa0ea"/>
     <circle cx="60" cy="${cy}" r="8" fill="#0b1226"/>
     <circle cx="66" cy="${cy-5}" r="3" fill="#eaf3ff"/>
   </g>`;
}

// Render determinístico em função do tempo (segundos)
function renderAt(t){
  const stage=$("#stage"), ov=$("#overlay"), ball=$("#ball"), tip=$("#tip");
  // Fases
  const T_IDLE=4.0, T_ALERT=0.6, T_BREAK=3.6, T_DONE=1.0, T_OUT=0.7;
  const a1=T_IDLE, a2=a1+T_ALERT, a3=a2+T_BREAK, a4=a3+T_DONE, a5=a4+T_OUT;

  // IDLE: anel enche 0->1
  let prog = clamp(t/ T_IDLE, 0, 1);
  // breathing
  const breath = 1 + 0.04*Math.sin(t*3.0);

  let ballColorIdle = true;
  let ovOpacity = 0;

  if(t < a1){                              // IDLE
    placeBall(breath);
    $("#ringfill").style.strokeDashoffset = RING*(1-prog);
    $("#ringfill").style.stroke = "#ffffff";
  } else if(t < a2){                       // ALERT (pulso vermelho)
    const k=(t-a1)/T_ALERT;
    placeBall(1 + 0.18*Math.sin(k*Math.PI));
    ballColorIdle=false;
    $("#ringfill").style.strokeDashoffset = 0;
    $("#ringfill").style.stroke = "#ff6b6b";
    ovOpacity = ease(k);
  } else if(t < a3){                       // BREAK
    const k=(t-a2)/T_BREAK;
    placeBall(1.0);
    ballColorIdle=false;
    ovOpacity = 1;
    // contagem 20 -> 0
    const remain = Math.ceil(lerp(20,0,k) - 1e-6);
    $("#cnum").textContent = Math.max(remain,0);
    $("#cfill").style.strokeDashoffset = RING*(k);
    // piscar: fecha ~120ms a cada 1.1s
    const ph=(t*1.0)%1.1;
    const open = ph>1.0 ? clamp((ph-1.0)/0.05,0,1)*0+ (ph<1.05?0:1) : 1;
    const blink = (ph>=1.0 && ph<1.08) ? 0 : 1;
    $("#eye").innerHTML = eyeSVG(blink);
    $("#ovtitle").textContent = "Olhe para uma distância de 6 metros";
    $("#ovsub").textContent = "Pisque devagar e relaxe os olhos";
    $("#countwrap").style.opacity = 1;
  } else if(t < a4){                       // DONE
    placeBall(1.0); ballColorIdle=false; ovOpacity=1;
    $("#eye").innerHTML = eyeSVG(1);
    $("#ovtitle").textContent = "Parabéns! 👁️💧";
    $("#ovsub").textContent = "Você renovou suas lágrimas";
    $("#countwrap").style.opacity = 0;
  } else {                                 // OUT -> volta ao idle
    const k=(t-a4)/T_OUT;
    placeBall(breath);
    ovOpacity = 1-ease(k);
    $("#ringfill").style.strokeDashoffset = RING; // anel zerado
    ballColorIdle = k>0.5;
  }

  ov.style.opacity = ovOpacity.toFixed(3);
  const col = ballColorIdle ? getComputedStyle(document.documentElement).getPropertyValue('--idle')
                            : getComputedStyle(document.documentElement).getPropertyValue('--alert');
  ball.style.background = `radial-gradient(circle at 35% 30%, #fff 0%, ${col} 52%, rgba(0,0,0,.35) 115%)`;
  tip.style.opacity = clamp(1.1 - ovOpacity,0,1);
}
window.renderAt = renderAt;
window.TOTAL = 9.9;
renderAt(0);
</script>
</body>
</html>
