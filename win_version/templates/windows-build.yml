# Build e publicação da versão Windows do Dry Eye Widget.
# Instale copiando para: .github/workflows/windows-build.yml
#
# - PR/push manual: compila e sobe os artefatos do build.
# - Tag vX.Y.Z: compila e anexa instalador + ZIP à GitHub Release.

name: Windows Build

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "lib/**"
      - "test/**"
      - "windows/**"
      - "analysis_options.yaml"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/windows-build.yml"
      - "win_version/templates/windows-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Fixado na versão estável usada/validada localmente (flutter --version).
          flutter-version: "3.44.1"
          cache: true

      - name: Habilitar desktop Windows
        run: flutter config --enable-windows-desktop

      - name: Dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Testes
        run: flutter test

      - name: Gerar ícones
        run: dart run flutter_launcher_icons

      - name: Build Release
        run: flutter build windows --release

      # --- Assinatura de código (OPCIONAL) -------------------------------------
      # Reduz/elimina o alerta "Editor desconhecido" do SmartScreen. Só roda se o
      # certificado estiver configurado nos Secrets do repositório:
      #   WINDOWS_CERT_BASE64   -> .pfx codificado em base64
      #   WINDOWS_CERT_PASSWORD -> senha do .pfx
      # Sem esses secrets, o passo é pulado e o build segue normalmente (não assinado).
      # Veja win_version/CODE_SIGNING.md para detalhes e limitações.
      - name: Assinar executável (se houver certificado)
        if: ${{ secrets.WINDOWS_CERT_BASE64 != '' }}
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          & signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            /f $pfx /p $env:WINDOWS_CERT_PASSWORD `
            "build\windows\x64\runner\Release\dry_eye_widget.exe"
          Remove-Item $pfx -Force

      - name: Gerar ZIP portátil
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath "dist\DryEyeWidget-windows-x64.zip" -Force

      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Gerar instalador
        shell: pwsh
        run: |
          $iss = "win_version\templates\dry-eye-widget.iss"
          if (Test-Path $iss) {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" $iss
          } else {
            Write-Warning "Script .iss não encontrado em $iss — pulando instalador."
          }

      # Assina o instalador final (mesma condição da assinatura do .exe).
      - name: Assinar instalador (se houver certificado)
        if: ${{ secrets.WINDOWS_CERT_BASE64 != '' }}
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $setup = "dist\DryEyeWidget-Setup-x64.exe"
          if (Test-Path $setup) {
            $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
            & signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
              /f $pfx /p $env:WINDOWS_CERT_PASSWORD $setup
            Remove-Item $pfx -Force
          } else {
            Write-Warning "Instalador não encontrado em $setup — pulando assinatura."
          }

      - name: Upload de artefatos (toda execução)
        uses: actions/upload-artifact@v4
        with:
          name: dry-eye-widget-windows
          path: |
            dist/DryEyeWidget-windows-x64.zip
            dist/DryEyeWidget-Setup-x64.exe
          if-no-files-found: warn

      - name: Anexar à Release (apenas em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DryEyeWidget-windows-x64.zip
            dist/DryEyeWidget-Setup-x64.exe
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
