name: dry_eye_widget
description: "Widget flutuante de olho seco - lembretes da regra 20-20-20 (always-on-top)."
publish_to: 'none'
version: 1.11.4+37

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  window_manager: ^0.5.1
  screen_retriever: ^0.2.0
  flutter_acrylic: ^1.1.4
  audioplayers: ^6.7.1
  local_notifier: ^0.1.5
  shared_preferences: ^2.2.2
  provider: ^6.1.0
  google_fonts: ^8.1.0
  launch_at_startup: ^0.5.1
  tray_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  fake_async: ^1.3.3
  msix: ^3.16.8

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/

# Ícone do app gerado a partir de icon.png (gere com: dart run flutter_launcher_icons)
flutter_launcher_icons:
  image_path: "icon.png"
  macos:
    generate: true
    image_path: "icon.png"
  windows:
    generate: true
    image_path: "icon.png"
    icon_size: 256

# Empacotamento MSIX para a Microsoft Store.
# A própria Store assina o pacote (política 10.2.9) — não é preciso certificado.
# Gere com: dart run msix:create --store
#
# IMPORTANTE: os três valores de identidade abaixo precisam ser IDÊNTICOS aos do
# Partner Center → seu app → Gerenciamento de produtos → Identidade do produto
# (Package/Identity/Name, Package/Identity/Publisher, PublisherDisplayName).
msix_config:
  display_name: Dry Eye Widget
  publisher_display_name: DR. Philipe Saraiva Cruz
  identity_name: DR.PhilipeSaraivaCruz.DryEyeWidget
  publisher: CN=71D5E9B9-21A8-4078-84B2-62C827D80D0E
  msix_version: 1.11.0.0
  logo_path: icon.png
  languages: pt-br, en-us
  capabilities: internetClient
  store: true
