name: dry_eye_widget
description: "Widget flutuante de olho seco - lembretes da regra 20-20-20 (always-on-top)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  window_manager: ^0.3.7
  screen_retriever: ^0.1.9
  flutter_acrylic: ^1.1.4
  audioplayers: ^5.2.1
  local_notifier: ^0.1.5
  shared_preferences: ^2.2.2
  provider: ^6.1.0
  google_fonts: ^6.1.0
  launch_at_startup: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
