name: dry_eye_widget
description: "Widget flutuante de olho seco - lembretes da regra 20-20-20 (always-on-top)."
publish_to: 'none'
version: 1.4.1+7

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  window_manager: ^0.3.7
  screen_retriever: ^0.1.9
  flutter_acrylic: ^1.1.4
  audioplayers: ^5.2.1
  local_notifier: ^0.1.5
  shared_preferences: ^2.2.2
  provider: ^6.1.0
  google_fonts: ^6.1.0
  launch_at_startup: ^0.5.1
  tray_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/

# Ícone do app gerado a partir de icon.png (gere com: dart run flutter_launcher_icons)
flutter_launcher_icons:
  image_path: "icon.png"
  macos:
    generate: true
    image_path: "icon.png"
  windows:
    generate: true
    image_path: "icon.png"
    icon_size: 256
